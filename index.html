<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Love Universe | Бесконечная нежность</title>

<style>
    * {
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 30% 10%, #110022, #030006);
        font-family: 'Segoe UI', 'Arial', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        touch-action: manipulation;
        position: relative;
    }

    /* центральное мягкое свечение — создаёт эффект любовного тумана */
    .center-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(255,100,200,0.3), rgba(155,80,220,0.1) 60%, transparent 90%);
        transform: translate(-50%, -50%);
        filter: blur(45px);
        pointer-events: none;
        z-index: 0;
        will-change: transform;
    }

    /* динамические элементы: плавающие слова */
    .item {
        position: absolute;
        white-space: nowrap;
        pointer-events: none;
        will-change: transform;
        z-index: 20;
        filter: drop-shadow(0 0 4px rgba(0,0,0,0.2));
        animation: floatUp linear forwards;
    }

    /* текстовая стилизация — мягкое сияние */
    .love-text {
        display: inline-block;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-shadow: 0 0 8px currentColor, 0 0 3px rgba(255,255,200,0.8);
        backdrop-filter: blur(1px);
        white-space: nowrap;
    }

    /* ключевая анимация подъёма с лёгким смещением */
    @keyframes floatUp {
        0% {
            transform: translateY(100vh) translateX(0) rotate(0deg);
            opacity: 0;
        }
        8% {
            opacity: 1;
        }
        92% {
            opacity: 1;
        }
        100% {
            transform: translateY(-180vh) translateX(calc(30px * var(--drift, 1))) rotate(calc(12deg * var(--rot, 1)));
            opacity: 0;
        }
    }

    /* ❄️ снежинки (мелкие нежные частицы) */
    .snow {
        position: absolute;
        background: radial-gradient(circle, #ffffff, #ffe0fc);
        border-radius: 50%;
        opacity: 0.6;
        pointer-events: none;
        will-change: transform;
        filter: blur(0.5px);
        box-shadow: 0 0 2px rgba(255,220,240,0.6);
        animation: snowfall linear forwards;
    }

    @keyframes snowfall {
        0% {
            transform: translateY(-10vh) translateX(0);
            opacity: 0.5;
        }
        10% {
            opacity: 0.9;
        }
        90% {
            opacity: 0.7;
        }
        100% {
            transform: translateY(110vh) translateX(calc(25px * var(--sway, 1)));
            opacity: 0;
        }
    }

    /* 💥 вспышка касания — эффект "поцелуй вселенной" */
    .flash {
        position: fixed;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,200,230,0.85), rgba(255,120,180,0.4) 40%, transparent 80%);
        pointer-events: none;
        z-index: 100;
        animation: burstFlash 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        will-change: transform, opacity;
    }

    @keyframes burstFlash {
        0% {
            transform: scale(0.2);
            opacity: 0.8;
        }
        50% {
            transform: scale(1.3);
            opacity: 0.9;
        }
        100% {
            transform: scale(2.2);
            opacity: 0;
        }
    }

    /* маленькая звёздная частица при клике (доп. магия) */
    .spark {
        position: fixed;
        width: 6px;
        height: 6px;
        background: radial-gradient(circle, #fff5b0, #ffb3e6);
        border-radius: 50%;
        pointer-events: none;
        z-index: 101;
        animation: sparkleFly 0.7s ease-out forwards;
    }

    @keyframes sparkleFly {
        0% {
            transform: scale(0.2) translate(0, 0);
            opacity: 1;
        }
        100% {
            transform: scale(0) translate(calc(40px * var(--dx, 1)), calc(-40px * var(--dy, 1)));
            opacity: 0;
        }
    }

    /* декоративное сообщение внизу (не мешает) */
    .love-quote {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        font-weight: 400;
        color: rgba(255,210,240,0.65);
        text-shadow: 0 0 5px #ff40b0;
        background: rgba(0,0,0,0.2);
        backdrop-filter: blur(4px);
        width: fit-content;
        margin: 0 auto;
        padding: 5px 16px;
        border-radius: 40px;
        pointer-events: none;
        z-index: 15;
        font-family: monospace;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }

    @media (max-width: 600px) {
        .love-quote { font-size: 9px; bottom: 12px; white-space: nowrap; }
        .flash { width: 85px; height: 85px; }
    }
</style>
</head>
<body>

<div class="center-glow"></div>
<div class="love-quote">✨ коснись экрана — отпусти любовь ✨</div>

<script>
    (function() {
        // --------------------------------------------------------------
        //  БОГАТЫЙ НАБОР ФРАЗ НА ИСПАНСКОМ, РУССКОМ, АНГЛИЙСКОМ (романтика)
        // --------------------------------------------------------------
        const textPhrases = [
            "Te amo ❤️", "Amor de mi vida", "Eres preciosa", "My love",
            "Me encantas", "Mi vida ❤️", "Te amo mucho", "My baby",
            "Eres mi todo", "My heart", "Siempre contigo", "💖",
            "Люблю тебя", "Ты моя вселенная", "Моя радость", "Нежность",
            "Eres mi sueño", "Cada día contigo", "Sweet love", "Eres magia",
            "Mi cielo", "You & me", "Вечно твоя", "Beso 💋", 
            "Corazón", "Amor eterno", "Perfecta", "Estrella mía"
        ];
        
        const colorPalette = [
            "#ff7ae6", "#ffb3f0", "#a0e7ff", "#c28aff", "#ff99c8", 
            "#7affd9", "#ffaa6b", "#fbc3ff", "#b4f0ff", "#ff6080"
        ];

        // -----  НАСТРОЙКИ ПЛОТНОСТИ (оптимизировано) -----
        const MAX_ITEMS = 48;          // макс количество слов на экране
        const SNOW_MAX = 70;           // мягкое ограничение снежинок (одновременно)
        
        let activeItems = 0;
        let activeSnow = 0;
        
        // Счётчики для мягкого контроля (чтобы не перегружать DOM)
        function getItemCount() {
            return document.querySelectorAll('.item').length;
        }
        
        function getSnowCount() {
            return document.querySelectorAll('.snow').length;
        }
        
        // --------------------------------------------------------------
        //  СОЗДАНИЕ ПЛАВАЮЩЕГО СЛОВА (оптимизированная версия)
        // --------------------------------------------------------------
        function createWordItem(xPos = null, forcedX = false) {
            // Проверка лимита – предотвращаем чрезмерное накопление
            if (getItemCount() >= MAX_ITEMS) return null;
            
            const element = document.createElement('div');
            element.className = 'item';
            
            // --- разнообразие анимации: слои скорости / дрейфа / вращения ---
            const layerType = Math.random();   // 0..1
            let durationSec;
            let driftFactor;
            let rotationFactor;
            
            if (layerType < 0.33) {
                // медленные, плавные, парят дольше
                durationSec = 32 + Math.random() * 8;
                driftFactor = (Math.random() - 0.5) * 0.9;   // -0.45..0.45
                rotationFactor = (Math.random() - 0.5) * 0.6;
            } else if (layerType < 0.67) {
                // средние
                durationSec = 20 + Math.random() * 10;
                driftFactor = (Math.random() - 0.5) * 1.2;
                rotationFactor = (Math.random() - 0.5) * 0.9;
            } else {
                // быстрые, яркие, игривые
                durationSec = 12 + Math.random() * 7;
                driftFactor = (Math.random() - 0.5) * 1.7;
                rotationFactor = (Math.random() - 0.5) * 1.2;
            }
            
            // индивидуальный масштаб шрифта (приятная вариативность)
            const fontSizeBase = 14 + Math.random() * 20;  // 14-34px
            const sizeMulti = (layerType < 0.33) ? 0.85 : (layerType > 0.7 ? 1.2 : 1.0);
            const finalFontSize = Math.floor(fontSizeBase * sizeMulti);
            
            // случайная фраза
            const randomPhrase = textPhrases[Math.floor(Math.random() * textPhrases.length)];
            const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            
            const textSpan = document.createElement('span');
            textSpan.className = 'love-text';
            textSpan.textContent = randomPhrase;
            textSpan.style.fontSize = finalFontSize + 'px';
            textSpan.style.color = randomColor;
            textSpan.style.fontWeight = Math.random() > 0.7 ? '700' : '500';
            
            // небольшая прозрачность для глубины (0.6 .. 1)
            const opacityVal = layerType < 0.25 ? 0.6 : (layerType > 0.8 ? 1 : 0.85);
            element.style.opacity = opacityVal;
            
            element.appendChild(textSpan);
            
            // --- позиционирование по горизонтали ---
            let leftPosition;
            if (forcedX && xPos !== null && !isNaN(xPos)) {
                leftPosition = Math.min(window.innerWidth - 20, Math.max(5, xPos));
            } else {
                leftPosition = Math.random() * (window.innerWidth - 40) + 10;
            }
            element.style.left = leftPosition + 'px';
            
            // Кастомные CSS-переменные для анимации дрейфа/поворота
            element.style.setProperty('--drift', driftFactor);
            element.style.setProperty('--rot', rotationFactor);
            element.style.animationDuration = durationSec + 's';
            
            document.body.appendChild(element);
            
            // Автоудаление через анимацию (время + запас)
            const removalDelay = (durationSec * 1000) + 200;
            setTimeout(() => {
                if (element && element.isConnected) element.remove();
            }, removalDelay);
            
            return element;
        }
        
        // --------------------------------------------------------------
        //  ❄️ СОЗДАНИЕ СНЕЖИНКИ (нежные, с лёгким покачиванием)
        // --------------------------------------------------------------
        function createSnowflake() {
            if (getSnowCount() > SNOW_MAX) return;
            
            const snowEl = document.createElement('div');
            snowEl.className = 'snow';
            
            const sizePx = 2 + Math.random() * 5;   // 2px - 7px
            snowEl.style.width = sizePx + 'px';
            snowEl.style.height = sizePx + 'px';
            snowEl.style.left = Math.random() * 100 + '%';
            
            // Длительность падения (от 7 до 18 секунд)
            const fallDuration = 7 + Math.random() * 12;
            snowEl.style.animationDuration = fallDuration + 's';
            
            // лёгкое боковое смещение (горизонтальный дрифт)
            const sway = (Math.random() - 0.5) * 1.6;
            snowEl.style.setProperty('--sway', sway);
            
            // вариация прозрачности
            const opacitySnow = 0.3 + Math.random() * 0.65;
            snowEl.style.opacity = opacitySnow;
            
            // случайная задержка старта, чтобы не все падали стройно
            const animDelay = Math.random() * 5;
            snowEl.style.animationDelay = animDelay + 's';
            
            document.body.appendChild(snowEl);
            
            // удаление после завершения анимации + запас
            const removeTimeout = (fallDuration + animDelay) * 1000 + 500;
            setTimeout(() => {
                if (snowEl && snowEl.isConnected) snowEl.remove();
            }, removeTimeout);
        }
        
        // --------------------------------------------------------------
        // 💥 ЭФФЕКТ КАСАНИЯ (вспышка + россыпь искр + дополнительные слова)
        // --------------------------------------------------------------
        function burstSparkles(centerX, centerY) {
            // создаём 6-10 маленьких искр, разлетающихся в стороны
            const sparkCount = 7 + Math.floor(Math.random() * 8);
            for (let i = 0; i < sparkCount; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                const angle = Math.random() * Math.PI * 2;
                const distance = 35 + Math.random() * 55;
                const dx = Math.cos(angle) * (Math.random() * 1.2 + 0.4);
                const dy = Math.sin(angle) * (Math.random() * 1.2 + 0.4);
                spark.style.setProperty('--dx', dx);
                spark.style.setProperty('--dy', dy);
                spark.style.left = (centerX - 3) + 'px';
                spark.style.top = (centerY - 3) + 'px';
                spark.style.width = (3 + Math.random() * 5) + 'px';
                spark.style.height = spark.style.width;
                document.body.appendChild(spark);
                setTimeout(() => { if(spark.isConnected) spark.remove(); }, 700);
            }
        }
        
        function touchEffect(clientX, clientY) {
            // координаты в пределах видимой области
            let x = Math.min(window.innerWidth - 10, Math.max(10, clientX));
            let y = Math.min(window.innerHeight - 10, Math.max(10, clientY));
            
            // 1) Вспышка (основной визуальный взрыв)
            const flashDiv = document.createElement('div');
            flashDiv.className = 'flash';
            flashDiv.style.left = (x - 55) + 'px';
            flashDiv.style.top = (y - 55) + 'px';
            document.body.appendChild(flashDiv);
            setTimeout(() => flashDiv.remove(), 600);
            
            // 2) Добавляем искристые частицы
            burstSparkles(x, y);
            
            // 3) При касании порождаем от 4 до 7 новых слов с центром в области клика
            const wordsAround = 4 + Math.floor(Math.random() * 5);  // 4..8 слов
            for (let i = 0; i < wordsAround; i++) {
                // небольшой разброс по X и Y для естественности, но слова появляются только с горизонтальным положением
                let offsetX = (Math.random() - 0.5) * 100;
                let posX = Math.min(window.innerWidth - 30, Math.max(10, x + offsetX));
                // вызываем создание слова с конкретной позицией (принудительно)
                if (getItemCount() < MAX_ITEMS + 3) {   // мягкий лимит, но с запасом
                    createWordItem(posX, true);
                }
            }
            
            // 4) дополнительно: если снежинок мало, создаём пару снежинок (как магия)
            if (getSnowCount() < SNOW_MAX - 5) {
                for (let s = 0; s < 2; s++) {
                    createSnowflake();
                }
            }
            
            // 5) лёгкая вибрация для тактильного эффекта (если поддерживается, не навязчиво)
            if (navigator.vibrate) {
                navigator.vibrate(12);
            }
        }
        
        // --------------------------------------------------------------
        //  ГЕНЕРАЦИЯ ФОНОВЫХ ЭЛЕМЕНТОВ (автоматический режим)
        // --------------------------------------------------------------
        let intervalWords = null;
        let intervalSnow = null;
        
        function startBackgroundGenerators() {
            // Плавающие слова: интервал ~330-420ms, но не чаще, чем нужно (поддержание плотности)
            intervalWords = setInterval(() => {
                const currentCount = getItemCount();
                if (currentCount < MAX_ITEMS - 5) {
                    // если мало элементов – создаём одно слово
                    createWordItem();
                } else if (currentCount < MAX_ITEMS) {
                    // умеренное создание, чтобы не перегружать, но поддерживать атмосферу
                    if (Math.random() < 0.45) createWordItem();
                }
                // Если достигнут максимум — не создаём лишнего
            }, 380);
            
            // Снежинки каждые 90-140 мс (мягкий снегопад, регулируем общее количество)
            intervalSnow = setInterval(() => {
                const snowCnt = getSnowCount();
                if (snowCnt < SNOW_MAX - 4) {
                    createSnowflake();
                } else if (snowCnt < SNOW_MAX) {
                    if (Math.random() < 0.3) createSnowflake();
                }
            }, 110);
        }
        
        // --------------------------------------------------------------
        //  АДАПТАЦИЯ ПОД ИЗМЕНЕНИЕ РАЗМЕРА ОКНА (чистка старых элементов не требуется)
        //  Но важно: если окно меняет размер, позиции новых элементов не ломаются
        // --------------------------------------------------------------
        function handleResize() {
            // просто небольшая корректировка: все существующие элементы остаются, 
            // но ничего критичного – не сбрасываем анимацию. 
            // Можно дополнительно "подтолкнуть" удаление висящих за экраном, но они сами исчезнут.
            // Однако нет смысла агрессивно чистить.
        }
        
        // --------------------------------------------------------------
        //  ОБРАБОТЧИКИ СОБЫТИЙ (touch + mouse)
        // --------------------------------------------------------------
        function onUserInteraction(e) {
            // Получаем координаты для touch или mouse
            let clientX, clientY;
            if (e.touches) {
                // touch событие
                if (e.touches.length) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else return;
                e.preventDefault();   // предотвращаем скролл/зум при касаниях (повышает отзывчивость)
            } else {
                // mouse / pointer
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            if (clientX !== undefined && clientY !== undefined) {
                touchEffect(clientX, clientY);
            }
        }
        
        // привязываем события для мобильных и пк
        document.addEventListener('touchstart', onUserInteraction, { passive: false });
        document.addEventListener('mousedown', onUserInteraction);
        
        // также ловим pointerdown как резерв (без дублирования эффектов, но безопасно)
        // но чтобы не было двойного срабатывания на мыши + pointer, добавим флаг?
        // Упростим: используем только mousedown и touchstart. Этого достаточно.
        
        // --------------------------------------------------------------
        //  ИНИЦИАЛИЗАЦИЯ: старт генераторов + небольшое начальное наполнение
        // --------------------------------------------------------------
        function initializeUniverse() {
            startBackgroundGenerators();
            
            // Запускаем начальные элементы, чтобы сцена не была пустой
            for (let i = 0; i < 14; i++) {
                setTimeout(() => createWordItem(), i * 70);
            }
            for (let i = 0; i < 22; i++) {
                setTimeout(() => createSnowflake(), i * 60);
            }
            
            // добавляем обработчик resize без сильных перестроек
            window.addEventListener('resize', () => {
                handleResize();
            });
            
            // бонус: очистка памяти при уходе вкладки в фон (опционально)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // не делаем агрессивных действий, просто не создаём лишнего, но интервалы остаются
                    // легкая экономия: можно ничего не менять, т.к. анимации css паузит браузер
                }
            });
        }
        
        // всё запускаем после полной загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeUniverse);
        } else {
            initializeUniverse();
        }
        
        // дополнительная функция для удаления "утечек" - периодическая чистка застрявших элементов раз в 20 секунд (безопасно)
        setInterval(() => {
            const allItems = document.querySelectorAll('.item');
            const allSnow = document.querySelectorAll('.snow');
            // проверка аномального накопления (баг защита)
            if (allItems.length > MAX_ITEMS + 10) {
                // удаляем лишние старые элементы (первые 15% от перебора)
                const toRemove = allItems.length - MAX_ITEMS;
                for (let i = 0; i < Math.min(toRemove, 8); i++) {
                    if (allItems[i]) allItems[i].remove();
                }
            }
            if (allSnow.length > SNOW_MAX + 15) {
                const toRemoveSnow = allSnow.length - SNOW_MAX;
                for (let i = 0; i < Math.min(toRemoveSnow, 10); i++) {
                    if (allSnow[i]) allSnow[i].remove();
                }
            }
        }, 20000);
    })();
</script>
</body>
</html>
